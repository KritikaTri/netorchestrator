# Create the secret first:
#   kubectl create secret generic netorch-gateway --from-literal=jwt-secret="$(openssl rand -base64 32)"
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, labels: { app: gateway } }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata:
      labels: { app: gateway }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: /metrics }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 20
      containers:
        - name: gateway
          image: netorch/gateway:latest
          ports: [ { containerPort: 8080, name: http } ]
          env:
            - { name: ADDR, value: ":8080" }
            - { name: GATEWAY_TOPOLOGY_UPSTREAMS, value: "http://topology-svc:8081" }
            - { name: GATEWAY_CHANGE_UPSTREAMS, value: "http://change-svc:8082" }
            - name: GATEWAY_JWT_SECRET
              valueFrom: { secretKeyRef: { name: netorch-gateway, key: jwt-secret } }
          resources:
            requests: { cpu: 200m, memory: 96Mi }
            limits: { memory: 256Mi }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ ALL ] } }
---
apiVersion: v1
kind: Service
metadata: { name: gateway }
spec:
  selector: { app: gateway }
  ports: [ { name: http, port: 80, targetPort: http } ]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: gateway }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gateway }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: gateway }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: gateway } }
