global: { scrape_interval: 15s, evaluation_interval: 15s }
rule_files: [ /etc/prometheus/alerts.yml ]
scrape_configs:
  - job_name: gateway
    static_configs: [ { targets: [ "gateway:8080" ] } ]
  - job_name: change-svc
    static_configs: [ { targets: [ "change:8082" ] } ]
  - job_name: topology-svc
    static_configs: [ { targets: [ "topology-1:8081", "topology-2:8081", "topology-3:8081" ] } ]
