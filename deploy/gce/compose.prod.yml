# Production-style single-VM stack. Images come from GHCR (see .github/workflows/publish.yml).
# Only Caddy is exposed to the internet; everything else lives on the private compose network.
x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ ALL ]
  security_opt: [ "no-new-privileges:true" ]
  mem_limit: 256m

x-topology: &topology
  <<: *hardened
  image: ghcr.io/${GHCR_OWNER:?missing}/netorch-topology-svc:${TAG:-latest}
  environment: { ADDR: ":8081" }

services:
  topology-1: *topology
  topology-2: *topology
  topology-3: *topology

  # the distroless image runs as uid 65532; a fresh named volume is root-owned
  volume-init:
    image: busybox:1.36
    command: [ "chown", "-R", "65532:65532", "/data" ]
    volumes: [ "change-data:/data" ]
    restart: "no"

  change:
    <<: *hardened
    image: ghcr.io/${GHCR_OWNER:?missing}/netorch-change-svc:${TAG:-latest}
    environment:
      ADDR: ":8082"
      CHANGE_LOG_PATH: /data/change-audit.jsonl
      CHANGE_TOPOLOGY_URL: http://topology-1:8081
    volumes: [ "change-data:/data" ]
    depends_on:
      volume-init: { condition: service_completed_successfully }

  gateway:
    <<: *hardened
    image: ghcr.io/${GHCR_OWNER:?missing}/netorch-gateway:${TAG:-latest}
    environment:
      ADDR: ":8080"
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:?missing}
      GATEWAY_TOPOLOGY_UPSTREAMS: http://topology-1:8081,http://topology-2:8081,http://topology-3:8081
      GATEWAY_CHANGE_UPSTREAMS: http://change:8082
      GATEWAY_RATE_RPS: "20"
      GATEWAY_RATE_BURST: "40"
      # public-facing demo: keep the state-changing budget small so the audit log cannot be flooded
      GATEWAY_CHANGE_RATE_RPS: "1"
      GATEWAY_CHANGE_RATE_BURST: "5"
    depends_on: [ topology-1, topology-2, topology-3, change ]

  caddy:
    image: caddy:2.8
    environment: { DOMAIN: "${DOMAIN:?missing}" }
    ports: [ "80:80", "443:443" ]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [ gateway ]
    restart: unless-stopped
    mem_limit: 128m

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom-data:/prometheus
    ports: [ "127.0.0.1:9090:9090" ]   # reachable only through an SSH tunnel
    restart: unless-stopped
    mem_limit: 384m

volumes:
  change-data:
  caddy-data:
  caddy-config:
  prom-data:
