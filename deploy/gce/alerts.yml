# SLO alerts for the metrics the services actually emit (see docs/SLO.md).
groups:
  - name: netorchestrator-slo
    rules:
      - alert: GatewayErrorBudgetBurnFast
        expr: |
          sum(rate(http_requests_total{service="gateway",code="5xx"}[5m]))
            / sum(rate(http_requests_total{service="gateway"}[5m])) > 0.01
        for: 5m
        labels: { severity: page }
        annotations: { summary: "Gateway 5xx ratio above 1% for 5m (burning the 99.9% availability budget ~10x too fast)" }

      - alert: TopologyAnalysisSlowP99
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(http_request_duration_seconds_bucket{service="topology-svc",route=~"POST /v1/analyze/.*"}[5m]))) > 0.25
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "topology-svc p99 above 250ms for 10m" }

      - alert: TopologyLoadShedding
        expr: sum(rate(topology_shed_total[5m])) > 0
        for: 5m
        labels: { severity: ticket }
        annotations: { summary: "topology-svc is returning 429; add replicas or raise TOPOLOGY_MAX_INFLIGHT" }

      - alert: GatewayUpstreamUnavailable
        expr: sum(rate(gateway_unavailable_total[5m])) > 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: "Gateway has no healthy upstream for a route (all circuit breakers open)" }

      - alert: AuditChainNotReady
        expr: up{job="change-svc"} == 0
        for: 1m
        labels: { severity: page }
        annotations: { summary: "change-svc is down; it refuses to start if the audit log fails verification, check its logs" }
