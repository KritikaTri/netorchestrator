name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
      - name: Go mod download
        run: go mod download
      - name: Build (core)
        run: go build ./...
      - name: Build (full tag)
        run: go build -tags full ./...

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/netorchestrator-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/netorchestrator-dashboard/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build --if-present

  # Local dev path for non-main branches to avoid pulling base images
  docker-local:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [ build-go ]
    steps:
      - uses: actions/checkout@v4
      - name: Build local binary
        run: make build-local
      - name: Compose up (local profile)
        run: |
          docker compose -f docker-compose.full.yml --profile local up -d
          # health check with retries
          for i in $(seq 1 30); do \
            if curl -fsS http://localhost:8080/health >/dev/null; then echo "API healthy"; break; fi; \
            echo "Waiting for API... ($i)"; sleep 2; \
          done
          curl -fsS http://localhost:8080/health || (docker compose -f docker-compose.full.yml --profile local logs api-local || true; exit 1)
      - name: Compose down
        if: always()
        run: docker compose -f docker-compose.full.yml --profile local down -v

  # Full Docker image build reserved for main branch/releases
  docker-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [ build-go ]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t netorchestrator/api:ci -f Dockerfile .
      - name: Save Docker image artifact
        run: |
          docker save netorchestrator/api:ci | gzip > api-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: api-image
          path: api-image.tar.gz

