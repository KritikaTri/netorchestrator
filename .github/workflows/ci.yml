name: CI

on:
  push:
    branches: [ dev-2 ]
  pull_request:
    branches: [ dev-2 ]

jobs:
  build-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
      - name: Go mod download
        run: go mod download
      - name: Build (core)
        run: go build ./...
      - name: Build (full tag)
        run: go build -tags full ./...

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/netorchestrator-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/netorchestrator-dashboard/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build --if-present

  docker-image:
    runs-on: ubuntu-latest
    needs: [ build-go ]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t netorchestrator/api:ci -f Dockerfile .
      - name: Save Docker image artifact
        run: |
          docker save netorchestrator/api:ci | gzip > api-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: api-image
          path: api-image.tar.gz

