name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core packages (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make fmt-check
      - run: make test

  whole-module:
    name: whole module build + vet (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -gcflags=-e ./...   # -e: report every error, not just the first 10
      - run: go vet ./...
